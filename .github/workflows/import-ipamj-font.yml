name: Import IPAmj Mincho font

on:
  push:
    paths:
      - .github/workflows/import-ipamj-font.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify original font
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ipamjm00601.zip" https://dforest.watch.impress.co.jp/library/i/ipamjfont/10750/ipamjm00601.zip
          mkdir -p "$RUNNER_TEMP/ipamj"
          unzip -q "$RUNNER_TEMP/ipamjm00601.zip" -d "$RUNNER_TEMP/ipamj"
          echo "a3e84f495f3c388db7a1473bf1985c1c076d0c814100f10a027ca6853eb1e8cb  $RUNNER_TEMP/ipamj/ipamjm.ttf" | sha256sum -c -
          cmp "$RUNNER_TEMP/ipamj/IPA_Font_License_Agreement_v1.0.txt" third_party/IPAmjMincho/IPA_Font_License_Agreement_v1.0.txt
          cmp "$RUNNER_TEMP/ipamj/Readme.txt" third_party/IPAmjMincho/Readme.txt
          cp "$RUNNER_TEMP/ipamj/ipamjm.ttf" third_party/IPAmjMincho/ipamjm.ttf
          chmod 644 third_party/IPAmjMincho/ipamjm.ttf
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test and pack
        run: |
          dotnet test ExcelRenderer.slnx --configuration Release
          dotnet pack src/ExcelRenderer/ExcelRenderer.csproj --configuration Release
          dotnet pack src/ExcelRenderer.Tool/ExcelRenderer.Tool.csproj --configuration Release
      - name: Commit font and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/IPAmjMincho/ipamjm.ttf
          git rm .github/workflows/import-ipamj-font.yml
          git commit -m "Bundle original IPAmj Mincho font and license"
          git push origin HEAD:main
