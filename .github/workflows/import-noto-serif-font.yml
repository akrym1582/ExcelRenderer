name: Import Noto Serif CJK JP font

on:
  push:
    paths:
      - .github/workflows/import-noto-serif-font.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify upstream font
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/NotoSerifCJKjp-Regular.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
          echo "d9854c7a8ef170b5a7932558856fd64eb8de0b007cd823fed6f9f514ad2803d3  $RUNNER_TEMP/NotoSerifCJKjp-Regular.otf" | sha256sum -c -
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/LICENSE" https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Serif/LICENSE
          cmp "$RUNNER_TEMP/LICENSE" third_party/NotoSerifCJKJP/LICENSE
          cp "$RUNNER_TEMP/NotoSerifCJKjp-Regular.otf" third_party/NotoSerifCJKJP/NotoSerifCJKjp-Regular.otf
          chmod 644 third_party/NotoSerifCJKJP/NotoSerifCJKjp-Regular.otf
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test and pack
        run: |
          dotnet test ExcelRenderer.slnx --configuration Release
          dotnet pack src/ExcelRenderer/ExcelRenderer.csproj --configuration Release
          dotnet pack src/ExcelRenderer.Tool/ExcelRenderer.Tool.csproj --configuration Release
      - name: Commit font and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/NotoSerifCJKJP/NotoSerifCJKjp-Regular.otf
          git rm .github/workflows/import-noto-serif-font.yml
          git commit -m "Bundle Noto Serif CJK JP font and license"
          git push origin HEAD:main
