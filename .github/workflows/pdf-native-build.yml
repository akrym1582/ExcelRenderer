name: Build PDF native assets
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python scripts/build-harfbuzz-subset.py
      - run: dotnet restore ExcelRenderer.slnx --locked-mode
      - run: dotnet build ExcelRenderer.slnx -c Release -t:Rebuild --no-restore --verbosity:minimal -m:1
      - run: dotnet test tests/ExcelRenderer.Tests -c Release --no-build --no-restore --filter "FullyQualifiedName~PdfBackendTests|FullyQualifiedName~PdfRemovalContractTests"
      - run: dotnet test tests/ExcelRenderer.Tool.Tests -c Release --no-build --no-restore
      - run: dotnet pack ExcelRenderer.slnx -c Release --no-build --no-restore -m:1 -p:BuildProjectReferences=false -o artifacts/pdf-native-packages
      - run: dotnet publish src/ExcelRenderer.Tool -c Release --no-restore -o artifacts/pdf-native-publish
      - run: python scripts/check-no-pdfsharp.py --packages artifacts/pdf-native-packages --publish artifacts/pdf-native-publish
      - run: python scripts/package_distribution.py --packages artifacts/pdf-native-packages --output artifacts/pdf-native-inventory.json
      - run: python scripts/validate-formulas-packages.py --packages artifacts/pdf-native-packages --work "${{ runner.temp }}/pdf-native-consumers"
      - uses: actions/upload-artifact@v4
        with:
          name: release-pdf-native-${{ runner.os }}
          path: native/runtimes/**
          if-no-files-found: error
