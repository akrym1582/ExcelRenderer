name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up fixed fonts for public renderer smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig ghostscript
          gs --version
          source scripts/test-fonts.sh
          echo "FONTCONFIG_FILE=$FONTCONFIG_FILE" >> "$GITHUB_ENV"


      - name: Verify fixed test font assets
        run: sha256sum -c tests/ExcelRenderer.Tests/Fonts/SHA256SUMS

      - name: Verify Core dependency direction and migrated ownership
        run: python3 scripts/check-core-dependencies.py

      - name: Verify source folder namespaces
        run: python3 scripts/check-source-namespaces.py

      - name: Verify NuGet publication allowlist
        run: python3 scripts/package_distribution.py

      - name: Restore dependencies
        run: dotnet restore ExcelRenderer.slnx --locked-mode

      - name: Check regression detection with temporary mutations
        run: python3 scripts/check-output-mutations.py

      - name: Verify shared Core geometry regression detection
        run: python3 scripts/check-core-shared-mutations.py

      - name: Rebuild solution
        run: dotnet build ExcelRenderer.slnx -t:Rebuild --configuration Release --no-restore

      - name: Verify standalone Reader and Core dependency isolation
        run: python3 scripts/validate-reader-isolation.py

      - name: Run unit tests
        env:
          EXCELRENDERER_REQUIRE_GHOSTSCRIPT: '1'
        run: >-
          dotnet test ExcelRenderer.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Decode PostScript source text and glyph metadata independently
        run: >-
          python3 scripts/decode-postscript-text.py
          tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/PostScript/fonts.ps
          --output tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/PostScript/source-text.json

      - name: Verify PostScript fonts and metadata against actual character operators
        run: >-
          python3 scripts/validate-postscript.py
          tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/PostScript/fonts.ps
          tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/PostScript/drawing.ps
          --output tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/PostScript/font-validation.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up independent PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install PyMuPDF==1.26.6 numpy==2.3.5 Pillow==12.3.0 fonttools==4.61.1 scipy==1.17.0

      - name: Compare finalized commands and public API fixtures
        run: python scripts/compare-pdf-backends.py --no-build

      - name: Compare frozen stage B against the new measurement and writer
        run: python scripts/compare-pdf-backends.py --no-generate --reference B --no-exceptions

      - name: Compare frozen Core output independently
        run: python scripts/compare-core-removal-baselines.py

      - name: Compare main and Core common contracts at 144 and 288 dpi
        run: python scripts/check-main-core-parity.py

      - name: Preserve reviewed main and Core PDF appearance for all 22 inputs
        run: python scripts/check-libreoffice-regression.py

      - name: Verify independent border coordinates, widths and colors
        run: >-
          python scripts/audit-libreoffice-borders.py
          --run artifacts/libreoffice-regression
          --output artifacts/libreoffice-regression/border-audit.json

      - name: Verify shared-border contracts reject missing strokes and text
        run: python scripts/check-shared-border-mutations.py

      - name: Validate image payload storage and corrected appearance
        run: python scripts/validate-image-review.py

      - name: Verify independent font format extraction
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from pdf_geometry_evidence import verify_font_formats
          results = verify_font_formats(Path('tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/PdfFormats'))
          Path('artifacts/pdf-comparison/font-formats.json').write_text(json.dumps(results, indent=2))
          PY

      - name: Verify comparison detects removed glyphs and additional ink
        run: python scripts/check-pdf-comparison-mutations.py

      - name: Pack four distribution packages
        run: dotnet pack ExcelRenderer.slnx -c Release --no-build --no-restore -p:BuildProjectReferences=false -o artifacts/formulas-packages

      - name: Audit removed dependency in source, graphs, assemblies and packages
        run: python scripts/check-no-pdfsharp.py --packages artifacts/formulas-packages

      - name: Verify dependency audit rejects deliberate contamination
        run: python scripts/check-no-pdfsharp-mutations.py

      - name: Verify isolated formula package consumers
        run: python3 scripts/validate-formulas-packages.py --packages artifacts/formulas-packages --work "$RUNNER_TEMP/formula-package-consumers"

      - name: Verify font package split with the same checks as the standalone workflow
        run: python3 scripts/validate-font-packages.py --packages artifacts/formulas-packages --work "$RUNNER_TEMP/font-package-consumers"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-pr-${{ github.event.pull_request.number }}
          path: |
            TestResults/**/*.trx
            TestResults/Mutations/**
            tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/**
            artifacts/pdf-comparison/**
            artifacts/pr90-image-review/independent.json
            artifacts/libreoffice-regression/**
          if-no-files-found: warn
          retention-days: 14

  main-core-windows:
    name: Main/Core semantic parity (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/ExcelRenderer.Tests --locked-mode
      - run: dotnet build tests/ExcelRenderer.Tests -c Release --no-restore
      - run: dotnet test tests/ExcelRenderer.Tests -c Release --no-build --filter "FullyQualifiedName~MainCoreParityTests|FullyQualifiedName~MainCoreExpectedDifferenceTests|FullyQualifiedName~DiagnosticPolicyTests|FullyQualifiedName~PdfFileExampleTests" --logger "trx;LogFileName=parity.trx" --results-directory TestResults/Parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-core-windows
          path: |
            TestResults/Parity/**
            tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/MainCoreParity/**
          retention-days: 14

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/ExcelRenderer.Core
            src/ExcelRenderer.OpenXml.Reader
            tests/ExcelRenderer.Core.Tests
            third_party/NotoSansJP
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Core tests
        run: dotnet restore tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj --locked-mode
      - name: Rebuild Core tests
        run: dotnet build tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj -t:Rebuild -c Release --no-restore --verbosity:minimal
      - name: Verify Core PDFs and coverage without shared fixtures or OS font setup
        run: dotnet test tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj -c Release --no-build --filter "Category!=Performance" -p:CollectCoverage=true --logger "trx;LogFileName=core.trx" --results-directory TestResults/Core
      - name: Measure Core conversions without coverage instrumentation
        run: dotnet test tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj -c Release --no-build --filter "Category=Performance" --logger "trx;LogFileName=performance.trx" --results-directory TestResults/Core
      - name: Upload Core results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}
          path: |
            TestResults/Core/**
            tests/ExcelRenderer.Core.Tests/bin/Release/net10.0/SampleOutputs/**
          if-no-files-found: warn
          retention-days: 14

  formulas:
    name: Formulas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify calculation engine dependency isolation
        run: python scripts/check-formulas-dependencies.py
      - name: Restore isolated engine tests
        run: dotnet restore tests/ExcelRenderer.Formulas.Tests/ExcelRenderer.Formulas.Tests.csproj --locked-mode
      - name: Rebuild isolated engine tests
        run: dotnet build tests/ExcelRenderer.Formulas.Tests/ExcelRenderer.Formulas.Tests.csproj -t:Rebuild -c Release --no-restore --verbosity:minimal
      - name: Run isolated engine tests without font or rendering setup
        run: dotnet test tests/ExcelRenderer.Formulas.Tests/ExcelRenderer.Formulas.Tests.csproj -c Release --no-build --logger "trx;LogFileName=formulas.trx" --results-directory TestResults/Formulas
      - name: Verify oracle tooling and all non-Excel pipelines
        shell: bash
        run: |
          python tools/ExcelRenderer.Formulas.Oracle/test_oracle.py
          dotnet restore tools/ExcelRenderer.Formulas.Oracle --locked-mode
          dotnet build tools/ExcelRenderer.Formulas.Oracle -c Release --no-restore -m:1
          python tools/ExcelRenderer.Formulas.Oracle/oracle.py generate TestResults/Formulas/inputs
          dotnet run --project tools/ExcelRenderer.Formulas.Oracle -c Release --no-build -- tests/ExcelRenderer.Formulas.Tests/Fixtures/Oracle/cases.json TestResults/Formulas/actual.json TestResults/Formulas/inputs TestResults/Formulas/roundtrip
          python tools/ExcelRenderer.Formulas.Oracle/oracle.py compare TestResults/Formulas/actual.json --require-roundtrip --output TestResults/Formulas/oracle-report.json

      - name: Upload formula test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formulas-${{ matrix.os }}
          path: TestResults/Formulas/**
          if-no-files-found: warn

  pdf-distribution:
    uses: ./.github/workflows/pdf-build-distribution.yml
