name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up fixed fonts for public renderer smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig
          source scripts/test-fonts.sh
          echo "FONTCONFIG_FILE=$FONTCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Verify fixed test font assets
        run: sha256sum -c tests/ExcelRenderer.Tests/Fonts/SHA256SUMS

      - name: Restore dependencies
        run: dotnet restore ExcelRenderer.slnx --locked-mode

      - name: Check regression detection with temporary mutations
        run: python3 scripts/check-output-mutations.py

      - name: Rebuild solution
        run: dotnet build ExcelRenderer.slnx -t:Rebuild --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test ExcelRenderer.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-pr-${{ github.event.pull_request.number }}
          path: |
            TestResults/**/*.trx
            TestResults/Mutations/**
            tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/**
          if-no-files-found: warn
          retention-days: 14

  slim:
    name: Slim (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Slim tests
        run: dotnet restore tests/ExcelRenderer.Slim.Tests/ExcelRenderer.Slim.Tests.csproj --locked-mode
      - name: Rebuild Slim tests
        run: dotnet build tests/ExcelRenderer.Slim.Tests/ExcelRenderer.Slim.Tests.csproj -t:Rebuild -c Release --no-restore --verbosity:minimal
      - name: Run Slim tests without OS font setup
        run: dotnet test tests/ExcelRenderer.Slim.Tests/ExcelRenderer.Slim.Tests.csproj -c Release --no-build --logger "trx;LogFileName=slim.trx" --results-directory TestResults/Slim
      - name: Verify Slim regression detection
        if: runner.os == 'Linux'
        run: python3 scripts/check-slim-mutations.py
      - name: Rasterize and compare on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
          python3 scripts/validate-slim.py --visual-only
      - name: Upload Slim results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-${{ matrix.os }}
          path: |
            TestResults/Slim/**
            tests/ExcelRenderer.Slim.Tests/bin/Release/net10.0/SampleOutputs/**
          if-no-files-found: warn
          retention-days: 14
