name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ExcelRenderer.slnx

      - name: Run unit tests
        run: >-
          dotnet test ExcelRenderer.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-pr-${{ github.event.pull_request.number }}
          path: |
            TestResults/**/*.trx
            tests/ExcelRenderer.Tests/bin/Release/net10.0/PdfSamples/**
          if-no-files-found: warn
          retention-days: 14
