name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up fixed fonts for public renderer smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig
          source scripts/test-fonts.sh
          echo "FONTCONFIG_FILE=$FONTCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Verify fixed test font assets
        run: sha256sum -c tests/ExcelRenderer.Tests/Fonts/SHA256SUMS

      - name: Verify Core dependency direction and migrated ownership
        run: python3 scripts/check-core-dependencies.py

      - name: Verify NuGet publication allowlist
        run: python3 scripts/package_distribution.py

      - name: Restore dependencies
        run: dotnet restore ExcelRenderer.slnx --locked-mode

      - name: Check regression detection with temporary mutations
        run: python3 scripts/check-output-mutations.py

      - name: Verify shared Core geometry regression detection
        run: python3 scripts/check-core-shared-mutations.py

      - name: Rebuild solution
        run: dotnet build ExcelRenderer.slnx -t:Rebuild --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test ExcelRenderer.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Pack four distribution packages
        run: dotnet pack ExcelRenderer.slnx -c Release --no-build --no-restore -p:BuildProjectReferences=false -o artifacts/formulas-packages

      - name: Verify isolated formula package consumers
        run: python3 scripts/validate-formulas-packages.py --packages artifacts/formulas-packages --work "$RUNNER_TEMP/formula-package-consumers"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-pr-${{ github.event.pull_request.number }}
          path: |
            TestResults/**/*.trx
            TestResults/Mutations/**
            tests/ExcelRenderer.Tests/bin/Release/net10.0/SampleOutputs/**
          if-no-files-found: warn
          retention-days: 14

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Core tests
        run: dotnet restore tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj --locked-mode
      - name: Rebuild Core tests
        run: dotnet build tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj -t:Rebuild -c Release --no-restore --verbosity:minimal
      - name: Run Core tests without OS font setup
        run: dotnet test tests/ExcelRenderer.Core.Tests/ExcelRenderer.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core.trx" --results-directory TestResults/Core
      - name: Verify Core regression detection
        if: runner.os == 'Linux'
        run: python3 scripts/check-core-mutations.py
      - name: Rasterize and compare on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
          python3 scripts/validate-core.py --visual-only
      - name: Upload Core results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}
          path: |
            TestResults/Core/**
            tests/ExcelRenderer.Core.Tests/bin/Release/net10.0/SampleOutputs/**
          if-no-files-found: warn
          retention-days: 14

  formulas:
    name: Formulas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify calculation engine dependency isolation
        run: python scripts/check-formulas-dependencies.py
      - name: Restore isolated engine tests
        run: dotnet restore tests/ExcelRenderer.Formulas.Tests/ExcelRenderer.Formulas.Tests.csproj --locked-mode
      - name: Rebuild isolated engine tests
        run: dotnet build tests/ExcelRenderer.Formulas.Tests/ExcelRenderer.Formulas.Tests.csproj -t:Rebuild -c Release --no-restore --verbosity:minimal
      - name: Run isolated engine tests without font or rendering setup
        run: dotnet test tests/ExcelRenderer.Formulas.Tests/ExcelRenderer.Formulas.Tests.csproj -c Release --no-build --logger "trx;LogFileName=formulas.trx" --results-directory TestResults/Formulas
      - name: Verify oracle tooling and all non-Excel pipelines
        shell: bash
        run: |
          python tools/ExcelRenderer.Formulas.Oracle/test_oracle.py
          dotnet restore tools/ExcelRenderer.Formulas.Oracle --locked-mode
          dotnet build tools/ExcelRenderer.Formulas.Oracle -c Release --no-restore -m:1
          python tools/ExcelRenderer.Formulas.Oracle/oracle.py generate TestResults/Formulas/inputs
          dotnet run --project tools/ExcelRenderer.Formulas.Oracle -c Release --no-build -- tests/ExcelRenderer.Formulas.Tests/Fixtures/Oracle/cases.json TestResults/Formulas/actual.json TestResults/Formulas/inputs TestResults/Formulas/roundtrip
          python tools/ExcelRenderer.Formulas.Oracle/oracle.py compare TestResults/Formulas/actual.json --require-roundtrip --output TestResults/Formulas/oracle-report.json

      - name: Upload formula test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formulas-${{ matrix.os }}
          path: TestResults/Formulas/**
          if-no-files-found: warn
