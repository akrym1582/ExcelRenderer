name: Verify Noto JP and color emoji

on:
  push:
    branches: [feature/noto-jp-emoji]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned upstream emoji font
        run: |
          mkdir -p third_party/NotoColorEmoji
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/googlefonts/noto-emoji/e20cbc2bbec1926686be9f9bee7d1d2cfa1fea0e/2D/fonts/NotoColorEmoji.ttf' \
            --output third_party/NotoColorEmoji/NotoColorEmoji.ttf
          echo '15671215ab769fdc7162a045d56fd7d7e477c51b04e6b3c761d914d8fdd6cc44  third_party/NotoColorEmoji/NotoColorEmoji.ttf' | sha256sum --check
          echo 'd930d5d52d15231c283089760f84584272ad5e37e14607ba0d19c798e7a9caec  third_party/NotoSansJP/NotoSansJP-Regular.ttf' | sha256sum --check
      - run: dotnet test ExcelRenderer.slnx --configuration Release
      - run: dotnet pack src/ExcelRenderer.Fonts/ExcelRenderer.Fonts.csproj --configuration Release --output artifacts/packages
      - name: Commit the verified font binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/NotoColorEmoji/NotoColorEmoji.ttf
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle Noto Color Emoji font'
            git push origin HEAD:feature/noto-jp-emoji
          fi
